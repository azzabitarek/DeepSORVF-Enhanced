# ──────────────────────────────────────────────────────────────────────
# paths.yaml — Central path configuration for DeepSORVF Modular
# ──────────────────────────────────────────────────────────────────────
# All paths are relative to the project root (projet/)
# On Google Drive, set DRIVE_ROOT env var or edit paths manually

project_root: "."          # resolved at runtime via os.getcwd()
drive_root: "/content/drive/MyDrive/DeepSORVF_Project"

# ── Raw data ──────────────────────────────────────────────────────────
data:
  clips:
    clip_01: "./clip-01/"
    Video_29: "./Video-29/"
    Video_34: "./Video-34/"
    Video_28: "./Video-28/"
    Video_10: "./Video-10/"
    clip_02: "./clip-02/"
    clip_10: "./clip-10/"

# ── Cache (intermediate outputs between sessions) ────────────────────
cache:
  frames_dir: "./data/frames_cache"
  metadata_file: "./data/frames_cache/metadata.pkl"
  resume_checkpoint: "./data/frames_cache/_resume_checkpoint.json"

# ── Processed data ───────────────────────────────────────────────────
processed:
  voc_xml_dir: "./data/processed/voc_xml"
  yolo_labels_dir: "./data/processed/yolo_labels"
  splits_file: "./data/processed/train_val_split.json"
  seaDronesSee_dir: "./data/processed/seaDronesSee"
  seaDronesSee_yolo: "./data/processed/seaDronesSee/labels"

# ── Pre-trained checkpoints ──────────────────────────────────────────
checkpoints:
  yolox_pretrained: "./detection_yolox/model_data/YOLOX-final.pth"
  yolox_custom: "./checkpoints/yolox_smd_final.pth"
  kolomverse_pretrained: "./best.pt"
  kolomverse_custom: "./checkpoints/kolomverse_final.pt"
  deepsort_reid: "./deep_sort/deep_sort/deep/checkpoint/ckpt.t7"

# ── Results ──────────────────────────────────────────────────────────
results:
  base_dir: "./data/results"
  experiments_dir: "./data/results"

# ── Models config paths ──────────────────────────────────────────────
models:
  yolox_classes: "./detection_yolox/model_data/ship_classes.txt"
  deepsort_config: "./deep_sort/configs/deep_sort.yaml"

# ── Training data paths ──────────────────────────────────────────────
training:
  train_txt: "./data/processed/2007_train.txt"
  val_txt: "./data/processed/2007_val.txt"
  vocdevkit_dir: "./data/processed/VOCdevkit"
